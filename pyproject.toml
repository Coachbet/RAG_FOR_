[project]
name = "carfix"
version = "1.0.0"
description = "CarFix: a RAG assistant that answers car repair questions from iFixit guides (with sources and refusals), plus a fine-tuned classifier that routes a car problem to the right system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "groq>=0.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "gradio>=5.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jupyter>=1.0", "matplotlib>=3.8", "umap-learn>=0.5", "huggingface-hub>=0.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carfix"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402", "E741", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["carfix"]
known-local-folder = ["fakes"]
